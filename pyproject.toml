[project]
name = "refill"
version = "0.1.0"
description = "Refill: caregiver refill-denial chase agent with a deterministic eligibility-calculator veto over Gemini."
requires-python = ">=3.11"

# Runtime + test dependencies. Pinned to the versions the offline suite is
# verified against, so a clean clone cannot drift from what we tested.
# `pip install -e .` installs all of these, which is what makes the README's
# `make test` and `make demo` work on a fresh machine.
dependencies = [
    "google-adk==2.8.0",
    "google-genai==2.20.0",
    "google-cloud-firestore==2.29.0",
    "google-cloud-storage==3.13.1",
    "opentelemetry-api==1.42.1",
    "opentelemetry-sdk==1.42.1",
    "reportlab==5.0.1",
    "pypdf==6.16.2",
    "pytest==9.1.1",
]

[tool.setuptools.packages.find]
include = ["agentspine*", "validator*", "agent*", "memory*", "artifacts*", "job*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
